<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1ea">
<title>Akku and Navu Love Story</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--ivory:#fff7f1;--blush:#fbd9de;--pink:#f4b6c2;--rose:#e5718e;--deep:#b83a5e;--gold:#c9965a;--plum:#4a1f35;--red:#d62846;
--serif:'Cormorant Garamond',Georgia,serif;--script:'Pinyon Script',cursive;--sans:'Jost',system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ivory);color:var(--plum);font-family:var(--sans);font-weight:300;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
.scene{position:absolute;inset:0;display:flex;overflow-y:auto;overflow-x:hidden;padding:84px 6vw 110px;visibility:hidden;opacity:0;transition:opacity .5s,visibility 0s .5s}
.scene.active{visibility:visible;opacity:1;transition:opacity .6s .1s,visibility 0s}
.in{margin:auto;position:relative;z-index:5;width:min(1100px,100%);text-align:center}
.rise{opacity:0}.active .rise{animation:rise 1.1s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(50px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.6rem,8vw,6rem);line-height:.95;margin:.1em 0 .25em}
h2 b{font-family:var(--script);font-weight:400;color:var(--deep);font-size:1.3em}
.kick{font-size:.85rem;letter-spacing:.28em;color:var(--deep);font-weight:500}
.hint{opacity:.7;margin:0 0 1.2rem}
.btn{display:inline-flex;gap:14px;align-items:center;border:0;border-radius:100px;padding:17px 38px;background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff;font-weight:500;letter-spacing:.16em;font-size:.82rem;box-shadow:0 14px 40px -10px rgba(184,58,94,.65);transition:transform .35s var(--ease)}
.btn:hover{transform:translateY(-4px) scale(1.04)}
/* chrome */
.top{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 5vw 0;pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:var(--script);font-size:1.9rem;color:var(--deep)}
#snd{border:1px solid rgba(184,58,94,.4);background:rgba(255,255,255,.5);border-radius:100px;padding:8px 16px;font-size:.75rem;letter-spacing:.14em;backdrop-filter:blur(6px)}
.bar{position:fixed;z-index:60;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:0 5vw calc(22px + env(safe-area-inset-bottom,0px))}
.dots{display:flex;gap:10px;align-items:center}
.dots button{width:9px;height:9px;border-radius:9px;border:0;padding:0;background:rgba(184,58,94,.28);transition:width .5s var(--ease),background .4s}
.dots button.on{width:34px;background:var(--deep)}
.nav{width:46px;height:46px;border-radius:50%;border:1px solid rgba(184,58,94,.45);background:rgba(255,255,255,.6);font-size:1.1rem;backdrop-filter:blur(6px);transition:transform .3s}
.nav:hover{transform:scale(1.12)}
#wipe{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;background:linear-gradient(160deg,#ef4a68,#9e1230);clip-path:inset(100% 0 0 0);font-size:4rem;color:#fff}
#wipe.go{animation:wipe 1.15s cubic-bezier(.7,0,.3,1)}
@keyframes wipe{0%{clip-path:inset(100% 0 0 0)}42%,58%{clip-path:inset(0)}100%{clip-path:inset(0 0 100% 0)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
/* scene 1 */
#s0{background:radial-gradient(circle at 50% 42%,#fff 0,#ffe9e6 38%,#f9cbd5 100%)}
#heart{position:absolute;inset:0;width:100%;height:100%}
.fl{position:absolute;z-index:2;pointer-events:none;color:var(--red);filter:drop-shadow(0 8px 14px rgba(214,40,70,.35))}
.fl b{display:block;font-weight:400;animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-22px) rotate(10deg)}}
.t1{font-family:var(--serif);font-weight:300;font-size:clamp(3rem,11vw,9rem);line-height:.92;margin:.2em 0 0;text-shadow:0 0 40px #fff,0 0 12px #fff}
.t2{font-family:var(--script);font-size:clamp(4.5rem,18vw,14rem);line-height:1.05;margin-top:-.08em;background:linear-gradient(100deg,#b83a5e,#e5718e 30%,#d8a76a 50%,#e5718e 70%,#b83a5e);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite;filter:drop-shadow(0 4px 14px rgba(255,255,255,.9))}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,2.6vw,1.7rem);margin:.4rem auto 1.8rem;max-width:34ch;text-shadow:0 0 14px #fff}
/* scene 2 */
#s1{background:linear-gradient(170deg,#fff0de,#fdd2d8 70%,#f7bccb)}
.bl{position:absolute;z-index:2;width:clamp(46px,7vw,80px);aspect-ratio:.82;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),var(--c) 45%);animation:sway var(--t,6s) ease-in-out infinite alternate;box-shadow:inset -8px -10px 20px rgba(0,0,0,.08)}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:90px;background:rgba(74,31,53,.3)}
@keyframes sway{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-34px) rotate(6deg)}}
.cake{background:none;border:0;padding:0;margin:10px auto 0;display:block;width:min(64vw,260px);filter:drop-shadow(0 24px 24px rgba(184,58,94,.3))}
.flame{transform-origin:50% 100%;animation:flick 1s ease-in-out infinite}
.out .flame{opacity:0;animation:none;transition:opacity .5s}
@keyframes flick{50%{transform:scale(.85,1.12) rotate(-5deg)}}
#reply{font-family:var(--script);font-size:clamp(2rem,6vw,3.4rem);color:var(--deep);min-height:1.4em;margin-top:8px}
/* scene 3 */
#s2{background:radial-gradient(#f2c9cf 1.2px,transparent 1.4px) 0 0/26px 26px,linear-gradient(#fff6ef,#ffe6dc)}
.polas{columns:3 220px;column-gap:clamp(14px,2.5vw,30px);margin-top:26px;text-align:left}
.pola{display:block;width:100%;break-inside:avoid;margin:0 0 clamp(14px,2.5vw,30px);background:#fff;padding:10px 10px 4px;border:0;box-shadow:0 22px 40px -16px rgba(184,58,94,.5);transform:rotate(var(--r));transition:transform .5s var(--ease)}
.pola:hover{transform:rotate(0) translateY(-8px) scale(1.03);z-index:2}
.pola img{display:block;width:100%;height:auto}
.ph{display:grid;place-items:center;width:100%;aspect-ratio:var(--ar,1);background:linear-gradient(150deg,var(--c1),var(--c2));color:rgba(255,255,255,.85);font-size:2.4rem}
.cap{display:block;font-family:var(--script);font-size:1.6rem;color:var(--deep);line-height:1.9;min-height:1.2em}
.btn.sm{padding:12px 26px;font-size:.75rem;margin-bottom:6px}
#lb{position:fixed;inset:0;z-index:75;background:rgba(74,31,53,.9);display:none;place-content:center;justify-items:center;padding:5vw;text-align:center;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:92vw;max-height:78vh;border:10px solid #fff;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#lb p{font-family:var(--script);color:#fff;font-size:2.2rem;margin:10px 0 0}
/* scene 4 */
#s3{background:linear-gradient(160deg,#f9d3da,#efa7b9 60%,#e58ca4)}
.env{position:relative;width:min(84vw,400px);height:min(54vw,260px);margin:20px auto;background:#fff3ee;border-radius:6px;box-shadow:0 30px 60px -20px rgba(120,20,60,.5);cursor:pointer;transition:transform .8s var(--ease),opacity .8s;border:0;padding:0;display:block}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#f6d2d8,#efbcc7);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3}
.env .pk{position:absolute;inset:0;background:linear-gradient(#fbe5e4,#f3c3cc);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:2}
.env .seal{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-22px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ef4a68,#9e1230);color:#fff;display:grid;place-items:center;z-index:4;transition:opacity .4s;font-size:1.3rem;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0}
.env.gone{transform:translateY(80px) scale(.7);opacity:0;pointer-events:none;position:absolute;left:50%;margin-left:-200px}
.paper{display:none;background:#fffaf5;max-width:620px;margin:0 auto;padding:clamp(26px,5vw,56px);box-shadow:0 30px 70px -20px rgba(120,20,60,.55);text-align:left;border-radius:3px}
.paper.show{display:block;animation:rise 1s var(--ease) both}
.paper p{font-family:var(--serif);font-size:clamp(1.25rem,2.4vw,1.55rem);line-height:1.65;margin:0;min-height:8em}
.paper .sg{font-family:var(--script);font-size:2.6rem;color:var(--deep);text-align:right;margin-top:14px}
/* scene 5 */
#s4{background:linear-gradient(170deg,#fff3e8,#fcd0d8 80%)}
.gifts{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:26px 0}
.tk{width:min(100%,290px);text-align:left;padding:20px 22px;background:#fff;border:1.5px dashed var(--rose);border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 18px 36px -18px rgba(184,58,94,.5);transition:transform .4s var(--ease),background .4s}
.tk:hover{transform:translateY(-6px) rotate(-1.5deg)}
.tk small{letter-spacing:.14em;font-size:.68rem;color:var(--deep);display:block}
.tk b{font-family:var(--serif);font-size:1.6rem;font-weight:500;line-height:1.1}
.tk .e{font-size:2rem;color:var(--red)}
.tk.on{background:linear-gradient(135deg,#ffe3e8,#fff);border-style:solid}
#fin{font-family:var(--script);font-size:clamp(2.6rem,8vw,5.5rem);color:var(--red);line-height:1.1;opacity:0;transform:translateY(20px);transition:all 1s var(--ease);margin:20px auto 6px;max-width:14em}
#fin.on{opacity:1;transform:none}
#fn{max-width:44ch;margin:0 auto 18px;font-family:var(--serif);font-size:1.3rem;opacity:0;transition:opacity 1.2s .4s}
#fn.on{opacity:1}
.again{background:none;border:0;text-decoration:underline;opacity:.7;margin-top:10px}
#hearts{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.hh{position:absolute;bottom:-50px;color:var(--red);opacity:0;animation:hrise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes hrise{0%{transform:translateY(0) rotate(-12deg);opacity:0}12%{opacity:.75}100%{transform:translateY(-115vh) rotate(14deg);opacity:0}}
@media(max-width:600px){.fl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
/* first page: heart on top, text below */
#s0{padding-bottom:96px}
#s0 .in{margin:auto auto 0;padding-top:38vh}
#s0 .kick{font-size:.78rem}
#s0 .kick:empty,#s0 .hint:empty{display:none}
#s0 .t1{font-size:min(11vw,7vh);line-height:1;margin:.1em 0 0}
#s0 .t2{font-size:min(14vw,7.5vh);margin-top:0}
#s0 .sub{font-size:min(4.6vw,2.4vh);margin:.3rem auto 1rem}
#s0 .hint{font-size:.92rem;margin-bottom:1.1rem!important}
@media(max-height:720px){#s0 .hint{display:none}#s0 .in{padding-top:34vh}}
/* story reader */
#s1{background:linear-gradient(170deg,#fff0de,#fdd2d8 70%,#f7bccb)}
#s5{background:radial-gradient(circle at 50% 30%,#fff 0,#ffe3e6 45%,#f4b6c2 100%)}
.rd{width:min(640px,100%)}
.yrs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid rgba(184,58,94,.4);background:rgba(255,255,255,.65);border-radius:99px;padding:6px 16px;font-size:.8rem;letter-spacing:.1em;transition:all .3s}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.sheet{position:relative;text-align:left;background:#fffaf5;padding:clamp(24px,5vw,44px);border-radius:3px;box-shadow:0 30px 70px -20px rgba(120,20,60,.5);overflow:hidden}
.sheet.swap{animation:rise .8s var(--ease) both}
.sheet .tag{font-family:var(--script);font-size:2.1rem;color:var(--deep);line-height:1.2}
.sheet h3{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:.1em 0 .2em}
.sheet .cont{font-size:.8rem;letter-spacing:.14em;opacity:.6;margin:2px 0}
.sheet .orn{color:var(--rose);letter-spacing:.5em;font-size:.8rem;margin:10px 0 14px}
.sheet p{font-family:var(--serif);font-size:clamp(1.2rem,2.3vw,1.45rem);line-height:1.65;margin:0 0 .8em;position:relative;z-index:1}
.sheet p:first-of-type::first-letter{float:left;font-family:var(--script);font-size:3.7em;line-height:.78;padding:.05em .1em 0 0;color:var(--deep)}
.sheet .num{position:absolute;right:14px;bottom:-12px;font-family:var(--serif);font-style:italic;font-size:7rem;line-height:1;opacity:.07;color:var(--deep)}
.sheet .ph1{display:block;width:100%;max-height:210px;object-fit:cover;border:6px solid #fff;box-shadow:0 14px 30px -12px rgba(184,58,94,.5);transform:rotate(-1.5deg);margin-bottom:16px}
.rdn{display:flex;align-items:center;gap:14px;margin-top:20px}
.rdn .btn{padding:13px 24px;font-size:.9rem}
.prog{flex:1;height:5px;border-radius:5px;background:rgba(184,58,94,.18);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--deep));transition:width .4s}
.q{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,4.6vw,2.3rem);line-height:1.3;max-width:24em;margin:.4rem auto 1.2rem}
.chat{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto 22px;min-height:110px;text-align:left}
.bub{max-width:84%;padding:12px 18px;border-radius:22px;font-family:var(--serif);font-size:1.3rem;animation:rise .6s var(--ease) both}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff;border-bottom-right-radius:6px}
.bub.you{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 8px 20px -8px rgba(184,58,94,.5)}
#fn2{max-width:22em;margin:0 auto 18px;font-family:var(--script);font-size:clamp(1.8rem,5vw,2.6rem);color:var(--deep);line-height:1.25;opacity:0;transition:opacity 1.2s .9s}
#fn2.on{opacity:1}
</style>
</head>

<div class="in"><div class="kick rise" id="kick"></div><h1 class="t1 rise" style="--d:.15s">Akku and Navu</h1><div class="t2 rise" style="--d:.35s" id="name"></div><p class="sub rise" style="--d:.5s" id="sub"></p><p class="hint rise" style="--d:.6s;max-width:34ch;margin:0 auto 1.6rem" id="intro"></p><button class="btn rise" style="--d:.7s" data-next type="button">BEGIN &#9825;</button></div></section>

<section class="scene" id="s1"><div class="in rd"><div class="kick rise" id="chk"></div><div class="yrs rise" style="--d:.1s" id="yrs"></div><div class="sheet" id="sheet"></div><div class="rdn"><button class="btn" id="sp" type="button" aria-label="Previous chapter">&#8592;</button><div class="prog"><i id="pg"></i></div><button class="btn" id="sn" type="button" aria-label="Next chapter">&#8594;</button></div></div></section>

<section class="scene" id="s2"><div class="in"><div class="kick rise">OUR MEMORIES</div><h2 class="rise" style="--d:.1s">Little <b>memories</b></h2><p class="hint rise" style="--d:.2s">Tap any photo to see it big. Add as many as you like.</p><button class="btn sm rise" style="--d:.25s" id="addBtn" type="button">+ ADD PHOTOS</button><div class="polas rise" style="--d:.3s" id="polas"></div><input type="file" accept="image/*" id="file" multiple hidden></div></section>

<section class="scene" id="s3"><div class="in"><div class="kick rise" style="color:#fff">A LETTER</div><h2 class="rise" style="--d:.1s;color:#fff">From my <b style="color:#fff">heart</b></h2>
<button class="env rise" style="--d:.25s" id="env" type="button" aria-label="Open the letter"><span class="flap"></span><span class="pk"></span><span class="seal">&#9829;</span></button>
<div class="paper" id="paper"><p id="lt"></p><div class="sg" id="sg"></div></div></div></section>

<section class="scene" id="s5"><div class="in"><div class="kick rise">ONE MORE TIME</div><h2 class="rise" style="--d:.1s">Send it <b>again</b></h2><p class="q rise" style="--d:.2s" id="q"></p><div class="chat" id="chat" aria-live="polite"></div><button class="btn" id="sendBtn" type="button">SEND IT AGAIN &#9825;</button></div></section>

<section class="scene" id="s4"><div class="in"><div class="kick rise">THE LAST CHAPTER</div><h2 class="rise" style="--d:.1s">Thank <b>you</b></h2><p class="hint rise" style="--d:.2s">Thank you for being more than just my lover. Tap each one.</p><div class="gifts rise" style="--d:.3s" id="gifts"></div>
<button class="btn" id="finBtn" type="button">ONE LAST THING &#9825;</button><div id="fin"></div><p id="fn"></p><p id="fn2"></p><button class="again" id="again" type="button">&#8635; read our story again</button></div></section>
</main>

<div class="bar"><button class="nav" id="back" type="button" aria-label="Previous page">&#8592;</button><div class="dots" id="dots"></div><button class="nav" id="next" type="button" aria-label="Next page">&#8594;</button></div>

  {yr:"2023",tag:"January 7, 2023",title:"The day our story began. ✨",ps:["It all started when I replied to your Instagram story about a church perunal. Since the perunal was in my mother’s native place, I texted you to ask about it. I asked, “Your home is in Karumady, right?” and you replied, “Yes.”"]},
  {yr:"2023",tag:"January 7, 2023",ps:["Little did we know that this simple conversation would become the beginning of our beautiful love story. ❤️","What started as a casual chat slowly became a daily habit. Day by day, our conversations grew longer, our bond became stronger, and somewhere between those endless chats, we fell in love. 😘💕"]},
  {yr:"2023",tag:"February 3, 2023",title:"Our First Movie Date 🎬❤️",ps:["I was the one who asked you to watch a movie with me, and that day became one of the happiest days of my life. I was so happy that I didn’t even feel like going home. Every moment with you felt special, and after that day, our chats continued just as before."]},
  {yr:"2023",tag:"February 3, 2023",ps:["Later, I asked you to come and see me, and we went to the Alappuzha Lighthouse. 🌊✨ That was where we expressed our love for each other. A beautiful moment that will always hold a special place in my heart."]},
  {yr:"2023",tag:"February 3, 2023",ps:["We met again, but soon, everything changed when my parents came to know about our meetings. Our happiness suddenly turned into a difficult phase, and on February 12, we had to take a break. 💔","Those days were painful for me. Being away from you felt unbearable, and it was one of the hardest moments in our journey."]},
  {yr:"2023",tag:"February 3, 2023",ps:["But sometimes, even when we try to walk away, our hearts refuse to give up on love. 🥹❤️","After five days, when I got my phone back, I texted you again, thinking that I should stop everything. But my heart couldn’t stop loving you. I continued calling you every day, especially while travelling back home. Those calls became a part of my everyday life. Sometimes, we even managed to meet.","No matter how many times life tried to separate us, somehow, we kept finding our way back to each other. 💕"]},
  {yr:"2023",tag:"🌸 2023",title:"Love Beyond Distance",ps:["In May, I went to Thiruvananthapuram for an internship, while you were studying there at Civilians. Even though life had taken us to different places, we found time to meet and create more memories together.","Then came June, July, August, September, and October — months of long-distance love. We missed each other, waited for each other, and held on to the love that connected us."]},
  {yr:"2023",tag:"🌸 2023",ps:["Finally, in November, we met again. ❤️","And from December onwards, when you started working in Alappuzha, we got the chance to see each other almost every day. Those little moments together became some of the sweetest parts of our journey."]},
  {yr:"2024",tag:"💕 2024",title:"Between Togetherness and Distance",ps:["In March, you left your job, and our meetings became occasional again.","April, May, June, and July passed with us being in a long-distance relationship. Then, in August, I started a course in Ernakulam, and once again, distance became a part of our love story.","But even when we couldn’t be together every day, our love continued."]},
  {yr:"2024",tag:"💕 2024",ps:["In October, we met again, and in November, I stopped my course. December brought us another chance to meet and spend precious time together. Every meeting felt special because we knew how much we had missed each other. 🥹💗"]},
  {yr:"2025",tag:"❤️ 2025",title:"Another Chapter of Our Journey",ps:["In January, I started my job in Ernakulam, and once again, we had to manage our relationship from a distance.","In March, we met again. Then came more waiting, missing, and counting the days until we could see each other.","In April, I got to meet you at your brother’s wedding — a beautiful memory that made me happy to be part of your special moments. 💍❤️"]},
  {yr:"2025",tag:"❤️ 2025",ps:["We met again in July and October, with long-distance days in between.","Then came a new beginning when you started working in Ernakulam. Finally, we could see each other almost every day again! It felt so good to have you closer to me.","But life had another plan. In November, I resigned from my job, and once again, distance became a part of our story."]},
  {yr:"2025",tag:"❤️ 2025",ps:["Sometimes, I wonder how many times we have had to adjust our lives, change our plans, and wait patiently just to spend time together. But every time, we kept going. And that is what makes our love story ours. ❤️"]},
  {yr:"2026",tag:"🥹❤️ March 6, 2026",title:"A Happy New Beginning",ps:["On March 6, 2026, I started my next job, and this time, it brought me a happiness I had been waiting for. I was here itself, closer to home and, most importantly, closer to you.","Finally, our long-distance chapter came to an end, and we got the chance to see and meet each other more easily."]},
  {yr:"2026",tag:"🥹❤️ March 6, 2026",ps:["Now, I feel so happy to be near my home, my favourite person, and everything that makes my life feel complete. After all those months of waiting, missing, travelling, and counting the days, being closer to you feels like a beautiful gift. 🫂❤️"]},
  {yr:"∞",tag:"😘💕",title:"Our Special Kind of Love",ps:["Of course, our relationship isn’t always a fairytale. We fight. We argue over little things. Sometimes, we get angry, misunderstand each other, and make each other upset.","But somehow, after every fight, we find our way back to love. We talk, we care, we forgive, and we continue choosing each other.","Fighting and loving again — that’s our main hobby! 😂❤️"]},
  {yr:"∞",tag:"😘💕",ps:["And honestly, I wouldn’t trade our journey for anything. Every happy moment, every tear, every misunderstanding, every reunion, and every day we spent missing each other has become a part of our story."]}
